services:
  mongodb:
    image: mongo:7.0
    container_name: noptrix-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    volumes:
      - noptrix_mongodb_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (error) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }).ok
          }' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: noptrix-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - noptrix_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  noptrix_mongodb_data:
  noptrix_redis_data:
    external: true
    name: noptrix_redis_data
